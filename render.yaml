services:
  - type: web
    name: acme-salary-management
    runtime: docker
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: REVIEWER_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: DB_PATH
        value: /app/data/acme.sqlite
      - key: PORT
        value: "3000"
